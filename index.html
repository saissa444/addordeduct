<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加扣分APP</title><style>body{font-family:system-ui,-apple-system,'Microsoft JhengHei',sans-serif;background:#f3f5f9;color:#1d2939;margin:0}main{max-width:850px;margin:auto;padding:24px 14px}section{background:white;border:1px solid #e1e6ee;border-radius:16px;padding:20px;margin:16px 0}h1{font-size:26px}h2{font-size:18px}label{display:block;font-weight:650;margin:13px 0 6px}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cdd5df;border-radius:9px;font-size:16px;background:white}textarea{min-height:85px}button{padding:12px 18px;border:0;border-radius:10px;background:#234e83;color:white;font-weight:650;cursor:pointer;margin:8px 8px 4px 0}button:disabled{opacity:.45}.editbox{background:#eef4fc;border:1px solid #c7d9f0;border-radius:12px;padding:16px;margin:12px 0}.editbox h3{margin:0 0 8px}.edit-actions{display:flex;flex-wrap:wrap}.secondary{background:#64748b}.editbox[hidden]{display:none}.muted{color:#64748b;font-size:13px}.err{color:#ae2530;white-space:pre-wrap}.ok{color:#127348}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px;border-bottom:1px solid #e7eaf0;text-align:left} .scroll{overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}section{padding:14px}}</style><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#234e83"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="加扣分APP"><link rel="apple-touch-icon" href="./icons/icon-180.png"></head><body><main><h1>加扣分APP</h1><p class="muted">第44、45期適用｜Excel 在本機瀏覽器處理，不會上傳至伺服器。使用前請先匯入兩份原始 Excel。</p><section><h2>① 匯入設定檔</h2><label>名冊</label><input id="roster" type="file" accept=".xlsx"><label>學校匯入範本（外收發加扣分匯入.xlsx）</label><input id="template" type="file" accept=".xlsx"><p id="status" class="muted" role="status">等待匯入檔案</p><p id="importError" class="err" role="alert"></p></section><section><h2>② 批次登錄</h2><label>學生查詢（女生隊號、建制隊號、姓名可混合輸入）</label><textarea id="ids" placeholder="例如：002、440000、王小明、011（均為示意）"></textarea><p class="muted">輸入範例：002、440000、王小明、011（皆為虛構示意，非實際學生資料）。可用頓號、逗號、空白或換行分隔；女生隊號可輸入 2 或 002。相同學生只登錄一次。</p><p id="matches" class="muted"></p><p id="lookupWarning" class="err" role="status" aria-live="polite"></p><div class="grid"><div><label>加扣分類型</label><select id="kind"><option>加分</option><option>扣分</option></select></div><div><label>分數（0.1 至 10.0）</label><input id="score" type="number" min="0.1" max="10" step="0.1" value="0.2"></div></div><label>加減分依據（歸類）</label><select id="category"></select><label>事蹟說明</label><select id="item"></select><label>說明（可自行編輯）</label><textarea id="detail" placeholder="例如：擔任公差，工作認真負責。"></textarea><p id="error" class="err"></p><button id="add">批次新增紀錄</button></section><section><h2>③ 預覽及匯出</h2><p id="count" class="muted">尚無紀錄</p><div id="editPanel" class="editbox" hidden><h3 id="editTitle">編輯單筆紀錄</h3><p class="muted">僅修改目前選取的學生，不影響其他紀錄。</p><div class="grid"><div><label for="editKind">加扣分類型</label><select id="editKind"><option>加分</option><option>扣分</option></select></div><div><label for="editScore">分數（0.1 至 10.0）</label><input id="editScore" type="number" min="0.1" max="10" step="0.1"></div></div><label for="editCategory">加減分依據（歸類）</label><select id="editCategory"></select><label for="editItem">事蹟說明（事由）</label><select id="editItem"></select><label for="editDetail">說明（可自行編輯）</label><textarea id="editDetail"></textarea><p id="editError" class="err" role="alert"></p><div class="edit-actions"><button id="saveEdit" type="button">儲存修改</button><button id="cancelEdit" type="button" class="secondary">取消</button></div></div><div class="scroll"><table><thead><tr><th>女生隊號</th><th>建制隊號</th><th>姓名</th><th>學籍號碼</th><th>類型</th><th>分數</th><th>事由</th><th>操作</th></tr></thead><tbody id="records"></tbody></table></div><button id="export">下載學校格式 Excel (.xlsx)</button><button id="clear" style="background:#64748b">清空紀錄</button><p class="muted">每次匯出以範本為底，清除原有明細資料後填入本次紀錄；不修改原始檔案。請在正式匯入學校系統前檢查產出結果。</p></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx-populate@1.21.0/browser/xlsx-populate.min.js"></script><script>
let roster={},template=null,options={},records=[];const $=id=>document.getElementById(id);const val=(sheet,cell)=>{const v=sheet.cell(cell).value();return v==null?'':String(v).trim()};const clean=n=>/^\d{1,3}$/.test(n)?n.padStart(3,'0'):n;
function parseTokens(){return $('ids').value.split(/[\s,，、;；]+/).map(x=>x.trim()).filter(Boolean)}
function resolveStudents(){const tokens=parseTokens(),found=[],seen=new Map(),errors=[],duplicates=new Map();for(const token of tokens){let matches=[];if(/^\d{1,3}$/.test(token)){const r=roster[clean(token)];if(r)matches=[r]}else if(/^\d+$/.test(token)){matches=Object.values(roster).filter(r=>r.unit===token||r.full===token)}else{matches=Object.values(roster).filter(r=>r.name===token)}if(matches.length===0){errors.push('找不到學生：'+token);continue}if(matches.length>1){errors.push('查詢結果不唯一：'+token+'，請改用隊號');continue}const r=matches[0];if(seen.has(r.full)){const entry=duplicates.get(r.full)||{student:r,count:1};entry.count++;duplicates.set(r.full,entry);continue}seen.set(r.full,token);found.push(r)}for(const {student,count} of duplicates.values()){errors.push('重複學生：'+student.id+' '+student.name+'（共輸入 '+count+' 次），已自動略過重複輸入')}return {found,errors}}
function updateMatches(){const {found,errors}=resolveStudents();$('matches').textContent=found.length?'已辨識 '+found.length+' 人：'+found.map(r=>r.id+' '+r.name+'（'+r.unit+'）').join('、'):'尚未辨識學生';$('lookupWarning').textContent=errors.join('\n')};
function normHeader(x){return String(x||'').replace(/[\s\u3000()（）:_-]/g,'').trim()}
function readRosterSheet(sh){
 const max=sh.usedRange().endCell().rowNumber(),endCol=Math.min(sh.usedRange().endCell().columnNumber(),40);
 let headers=null,headerRow=0;
 for(let r=1;r<=Math.min(max,12);r++){
  const h={};for(let c=1;c<=endCol;c++){const label=normHeader(sh.cell(r,c).value());if(label&&!h[label])h[label]=c}
  if((h['姓名']||h['學生姓名'])&&(h['女生隊號']||h['女生隊編號'])&&(h['學籍號碼']||h['完整學籍號碼']||h['完整建制隊學號']||h['學號'])){headers=h;headerRow=r;break}
 }
 if(!headers)return null;
 const col=(...names)=>names.map(n=>headers[n]).find(Boolean);
 const nameCol=col('姓名','學生姓名'),idCol=col('女生隊號','女生隊編號'),fullCol=col('完整學籍號碼','完整建制隊學號','學籍號碼','學號'),unitCol=col('建制隊號','建制隊學號');
 const next={};let invalid=0;
 for(let r=headerRow+1;r<=max;r++){
  const get=c=>c?String(sh.cell(r,c).value()??'').trim():'';
  const name=get(nameCol),rawId=get(idCol).replace(/\.0$/,''),full=get(fullCol).replace(/\.0$/,''),unit=get(unitCol).replace(/\.0$/,'');
  if(!name&&!rawId&&!full)continue;
  if(!name||!/^[0-9]{1,3}$/.test(rawId)||!/^[0-9]{9,12}$/.test(full)){invalid++;continue}
  const id=clean(rawId);if(next[id])throw Error('女生隊號重複：'+id+'（第 '+r+' 列）');
  next[id]={id,name,full,unit};
 }
 return {next,invalid};
}
$('roster').onchange=async e=>{try{
 $('importError').textContent='';$('status').textContent='正在讀取名冊…';
 if(!window.XlsxPopulate)throw Error('Excel 處理函式庫未載入。請連接網路後重新開啟 App，或改用 Chrome／Edge。');
 const file=e.target.files[0];if(!file)return;
 const wb=await XlsxPopulate.fromDataAsync(await file.arrayBuffer());
 let parsed=null;for(const sh of wb.sheets()){const candidate=readRosterSheet(sh);if(candidate&&Object.keys(candidate.next).length){parsed=candidate;break}}
 if(!parsed)throw Error('找不到有效資料。請確認有「姓名」、「女生隊號」、「學籍號碼」欄位，且學籍號碼為9至12位數字。');
 roster=parsed.next;$('status').textContent='名冊載入 '+Object.keys(roster).length+' 人'+(parsed.invalid?'（略過 '+parsed.invalid+' 列格式不符資料）':'')+'；'+(template?'範本已載入':'請繼續匯入範本');updateMatches();
 }catch(err){$('importError').textContent='名冊讀取失敗：'+err.message;$('status').textContent='名冊載入失敗'} };
$('template').onchange=async e=>{try{$('importError').textContent='';$('status').textContent='正在讀取匯入範本…';if(!window.XlsxPopulate)throw Error('Excel 處理函式庫未載入。請連接網路後重新開啟 App，或改用 Chrome／Edge。');const wb=await XlsxPopulate.fromDataAsync(await e.target.files[0].arrayBuffer());const sh=wb.sheet('加扣分項目');if(!sh)throw Error('找不到「加扣分項目」工作表');const opts={};for(let c=1;c<=8;c++){const category=String(sh.cell(14,c).value()||'').trim();if(!category)continue;opts[category]=[];for(let r=15;r<=Math.min(300,sh.usedRange().endCell().rowNumber());r++){const v=sh.cell(r,c).value();if(typeof v==='string'&&v.trim())opts[category].push(v.trim())}}if(!Object.keys(opts).length)throw Error('範本中沒有分類選項');options=opts;template=wb;renderCategories();$('status').textContent='範本已載入；名冊 '+Object.keys(roster).length+' 人'}catch(err){$('importError').textContent='範本讀取失敗：'+err.message;$('status').textContent='範本載入失敗'}};
function renderCategories(){const prefix=$('kind').value==='加分'?'優良':'不良';$('category').innerHTML='';Object.keys(options).filter(k=>k.startsWith(prefix)).forEach(k=>$('category').add(new Option(k,k)));renderItems()}function renderItems(){$('item').innerHTML='';(options[$('category').value]||[]).forEach(x=>$('item').add(new Option(x,x)))}$('kind').onchange=renderCategories;$('category').onchange=renderItems;$('ids').oninput=updateMatches;
$('add').onclick=()=>{const {found,errors:lookupErrors}=resolveStudents(),p=Number($('score').value),reason=$('item').value,cat=$('category').value;let errors=[];if(!Object.keys(roster).length||!template)errors.push('請先匯入名冊與範本');if(!parseTokens().length)errors.push('請輸入至少一筆學生資料');if(!found.length&&parseTokens().length)errors.push('沒有可新增的學生，請檢查輸入的隊號或姓名');if(!Number.isFinite(p)||p<0.1||p>10||Math.abs(p*10-Math.round(p*10))>1e-7)errors.push('分數須為 0.1 至 10.0，且以 0.1 為級距');if(!reason||!cat)errors.push('請選擇分類及事蹟說明');$('error').style.color='#ae2530';$('error').textContent=errors.join('\n');$('lookupWarning').textContent=lookupErrors.join('\n');if(errors.length)return;found.forEach(r=>records.push({...r,kind:$('kind').value,score:Math.round(p*10)/10,cat,reason,detail:$('detail').value.trim()}));renderRecords();$('error').textContent='已新增 '+found.length+' 筆紀錄'+(lookupErrors.length?'；'+lookupErrors.length+' 筆未新增（找不到、查詢不唯一或重複輸入），請查看紅字提示。':'。');$('error').style.color='#127348'};
let editingIndex=null;
function editCategoryOptions(selectedCategory,selectedItem){const prefix=$('editKind').value==='加分'?'優良':'不良';const categories=Object.keys(options).filter(k=>k.startsWith(prefix));$('editCategory').replaceChildren();categories.forEach(k=>$('editCategory').add(new Option(k,k)));if(categories.includes(selectedCategory))$('editCategory').value=selectedCategory;editItemOptions(selectedItem)}
function editItemOptions(selectedItem){const items=options[$('editCategory').value]||[];$('editItem').replaceChildren();items.forEach(v=>$('editItem').add(new Option(v,v)));if(items.includes(selectedItem))$('editItem').value=selectedItem}
$('editKind').onchange=()=>editCategoryOptions(null,null);
$('editCategory').onchange=()=>editItemOptions(null);
function cancelEditing(){editingIndex=null;$('editPanel').hidden=true;$('editError').textContent=''}
$('cancelEdit').onclick=cancelEditing;
function startEditing(i){const r=records[i];if(!r)return;editingIndex=i;$('editTitle').textContent='編輯紀錄：'+r.id+' '+r.name;$('editKind').value=r.kind;$('editScore').value=r.score.toFixed(1);editCategoryOptions(r.cat,r.reason);$('editDetail').value=r.detail||'';$('editError').textContent='';$('editPanel').hidden=false;$('editPanel').scrollIntoView({behavior:'smooth',block:'start'})}
$('saveEdit').onclick=()=>{if(editingIndex===null||!records[editingIndex])return;const p=Number($('editScore').value),kind=$('editKind').value,cat=$('editCategory').value,reason=$('editItem').value;const errors=[];if(!Number.isFinite(p)||p<0.1||p>10||Math.abs(p*10-Math.round(p*10))>1e-7)errors.push('分數須為 0.1 至 10.0，且以 0.1 為級距');if(!cat||!reason)errors.push('請選擇分類及事由');if((kind==='加分'&&!cat.startsWith('優良'))||(kind==='扣分'&&!cat.startsWith('不良')))errors.push('分類與加扣分類型不一致');$('editError').textContent=errors.join('\n');if(errors.length)return;Object.assign(records[editingIndex],{kind,score:Math.round(p*10)/10,cat,reason,detail:$('editDetail').value.trim()});cancelEditing();renderRecords();$('count').textContent+='（修改已儲存）'};
function renderRecords(){$('count').textContent='本次共 '+records.length+' 筆';$('records').replaceChildren();records.forEach((r,i)=>{const tr=document.createElement('tr');[r.id,r.unit,r.name,r.full,r.kind,r.score.toFixed(1),r.reason].forEach(x=>{const td=document.createElement('td');td.textContent=x;tr.appendChild(td)});const td=document.createElement('td'),edit=document.createElement('button'),del=document.createElement('button');edit.textContent='編輯';edit.onclick=()=>startEditing(i);del.textContent='刪除';del.className='secondary';del.onclick=()=>{records.splice(i,1);if(editingIndex!==null)cancelEditing();renderRecords()};td.append(edit,del);tr.appendChild(td);$('records').appendChild(tr)})}
$('clear').onclick=()=>{if(confirm('確定清空本次紀錄？')){records=[];cancelEditing();renderRecords()}};
$('export').onclick=async()=>{try{if(!template||!records.length)throw Error('請先載入範本並新增紀錄');const wb=await XlsxPopulate.fromDataAsync(await template.outputAsync());const sh=wb.sheet('工作表1');if(!sh)throw Error('找不到「工作表1」');const last=Math.max(192,sh.usedRange().endCell().rowNumber(),records.length+1);for(let r=2;r<=last;r++)for(let c=1;c<=7;c++)sh.cell(r,c).value(null);records.forEach((x,i)=>{const r=i+2;sh.cell('A'+r).value(x.full);sh.cell('B'+r).value(x.name);sh.cell('C'+r).value(x.cat);sh.cell('D'+r).value(x.reason);sh.cell('E'+r).value(x.detail);sh.cell('F'+r).formula('IF(LEFT(C'+r+',2)="優良","加分",IF(LEFT(C'+r+',2)="不良","扣分",""))');sh.cell('G'+r).value(x.score)});const blob=await wb.outputAsync();const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='加扣分APP匯入_'+new Date().toISOString().slice(0,10)+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(err){$('error').textContent='匯出失敗：'+err.message}};
</script><script>if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('PWA service worker:',err)));}</script></body></html>
